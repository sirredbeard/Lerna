name: Build Lerna

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            executable: lerna
            asset: lerna-linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            executable: lerna
            asset: lerna-linux-arm64
          - os: windows-2025
            rid: win-x64
            executable: lerna.exe
            asset: lerna-win-x64.exe
          - os: macos-15
            rid: osx-arm64
            executable: lerna
            asset: lerna-osx-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev
      - name: Publish native binary
        run: dotnet publish src/Lerna -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishAot=true -o out -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true
      - name: Test
        run: |
          export LERNA_BINARY="$PWD/out/${{ matrix.executable }}"
          "$LERNA_BINARY" version
          node --test tests/*.test.mjs
      - name: Stage release asset
        run: |
          mkdir -p artifacts
          cp "out/${{ matrix.executable }}" "artifacts/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish checked binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum lerna-* > SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" lerna-* SHA256SUMS --clobber
          else
            gh release create "$TAG" lerna-* SHA256SUMS \
              --verify-tag --prerelease --title "Lerna $TAG" \
              --notes "Azure sign-in and native Copilot integration. Preview for GitHub Copilot CLI ${TAG#v}."
          fi
